name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-quality-gate:
    name: Backend quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run backend unit tests
        run: python -m pytest

      - name: Run deterministic eval harness
        run: python -m app.eval.run_eval

      - name: Generate deterministic demo report
        run: python -m app.eval.generate_demo_report --output "$DEMO_REPORT_PATH"
        env:
          DEMO_REPORT_PATH: ${{ runner.temp }}/vulnsage-demo-report.json

      - name: Validate deterministic demo report
        run: python -m app.eval.report_validator "$DEMO_REPORT_PATH"
        env:
          DEMO_REPORT_PATH: ${{ runner.temp }}/vulnsage-demo-report.json
